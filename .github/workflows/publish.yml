name: Publish Cloud Mail
on:
  push:
    branches: [main]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-mail-production
  cancel-in-progress: false
jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::A newer main commit exists; start a new Publish run"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm --dir mail-worker install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloud-mail-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-agent-cloud-mail
      - name: Verify existing resources and publish
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/ai-agent-cloud-mail
          WRANGLER_SEND_METRICS: false
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { resolve } from 'node:path';
          import { isDeepStrictEqual } from 'node:util';
          const env = process.env;
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'JWT_SECRET',
                             'GITHUB_TOKEN', 'GITHUB_REPOSITORY', 'GITHUB_SHA']) {
            assert(env[key], 'Missing environment value: ' + key);
          }
          assert(/^[0-9a-f]{32}$/.test(env.CLOUDFLARE_ACCOUNT_ID), 'Invalid account ID');
          const path = resolve(env.RELEASE_DIR, 'wrangler.json');
          const config = JSON.parse(readFileSync(path, 'utf8'));
          assert(config.workers_dev === false && config.preview_urls === false && config.keep_vars === true);
          const allowedConfig = new Set(['name', 'main', 'compatibility_date', 'compatibility_flags',
                                         'observability', 'd1_databases', 'kv_namespaces', 'assets',
                                         'triggers', 'vars', 'workers_dev', 'preview_urls', 'keep_vars']);
          const unexpectedConfig = Object.keys(config).filter(key => !allowedConfig.has(key));
          assert.deepEqual(unexpectedConfig, [], 'Unsupported deployment configuration');
          Object.assign(config, {name: 'paloexiz-cloud-mail', account_id: env.CLOUDFLARE_ACCOUNT_ID});
          delete config.vars; // Cloudflare owns runtime variables; --keep-vars retains them.
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + config.account_id + path, {
              headers: {Authorization: 'Bearer ' + env.CLOUDFLARE_API_TOKEN},
              signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            assert(response.ok && data.success, 'Cloudflare resource verification failed: HTTP ' + response.status);
            return data.result;
          }
          async function requireLatestMain() {
            const response = await fetch('https://api.github.com/repos/' + env.GITHUB_REPOSITORY + '/git/ref/heads/main', {
              headers: {Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + env.GITHUB_TOKEN,
                        'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            assert(response.ok && data.object?.sha === env.GITHUB_SHA,
                   'A newer main commit exists; start a new Publish run');
          }
          const worker = '/workers/scripts/' + encodeURIComponent(config.name);
          async function snapshot() {
            const {bindings} = await api(worker + '/settings');
            assert(Array.isArray(bindings) && new Set(bindings.map(b => b.name)).size === bindings.length, 'Invalid or duplicate bindings');
            const required = {db: 'd1', kv: 'kv_namespace', assets: 'assets', domain: 'json',
                              admin: 'plain_text', analysis_cache: 'plain_text', project_link: 'plain_text'};
            for (const [name, type] of Object.entries(required)) {
              assert(bindings.some(b => b.name === name && b.type === type), 'Missing or invalid Cloudflare binding: ' + name);
            }
            for (const binding of bindings) {
              assert(['plain_text', 'json', 'secret_text'].includes(binding.type) ||
                     ({db: 'd1', kv: 'kv_namespace', assets: 'assets'})[binding.name] === binding.type,
                     'Unsupported binding; stop to avoid removing it');
            }
            const subdomain = await api(worker + '/subdomain');
            assert(subdomain.enabled === false && subdomain.previews_enabled === false, 'Default and preview addresses must stay disabled');
            return bindings.map(b => {
              if (b.type === 'secret_text' || b.type === 'assets') return {name: b.name, type: b.type};
              if (b.type === 'd1') {
                assert(!b.database_id || !b.id || b.database_id === b.id, 'Conflicting D1 identifiers');
                return {name: b.name, type: b.type, database_id: b.database_id ?? b.id};
              }
              if (b.type === 'kv_namespace') return {name: b.name, type: b.type, namespace_id: b.namespace_id};
              if (b.type === 'plain_text') return {name: b.name, type: b.type, text: b.text};
              return {name: b.name, type: b.type, json: b.json};
            }).sort((a, b) => a.name.localeCompare(b.name));
          }
          const before = await snapshot();
          const db = before.find(b => b.name === 'db');
          const kv = before.find(b => b.name === 'kv');
          assert(/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(db.database_id), 'Invalid bound D1 ID');
          assert(/^[0-9a-f]{32}$/.test(kv.namespace_id), 'Invalid bound KV ID');
          const database = await api('/d1/database/' + db.database_id);
          await api('/storage/kv/namespaces/' + kv.namespace_id);
          config.d1_databases = [{binding: 'db', database_name: database.name, database_id: db.database_id}];
          config.kv_namespaces = [{binding: 'kv', id: kv.namespace_id}];
          writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          const expected = before.filter(b => b.name !== 'jwt_secret');
          expected.push({name: 'jwt_secret', type: 'secret_text'});
          expected.sort((a, b) => a.name.localeCompare(b.name));
          const secretPath = resolve(env.RUNNER_TEMP, 'ai-agent-cloud-mail-secrets.json');
          const deployEnv = {...env};
          delete deployEnv.GITHUB_TOKEN;
          delete deployEnv.JWT_SECRET;
          await requireLatestMain();
          try {
            writeFileSync(secretPath, JSON.stringify({jwt_secret: env.JWT_SECRET}) + '\n', {mode: 0o600});
            execFileSync('pnpm', ['exec', 'wrangler', 'deploy', '--config', path, '--no-bundle',
                                  '--keep-vars', '--strict', '--secrets-file', secretPath],
                         {stdio: 'inherit', env: deployEnv});
          } finally {
            rmSync(secretPath, {force: true});
          }
          assert(isDeepStrictEqual(expected, await snapshot()), 'Cloudflare bindings or variables changed during deployment');
          console.log('Worker published. Run database schema upgrades separately only when required by upstream changes.');
          JS
