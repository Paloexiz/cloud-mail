name: Prepare Cloud Mail
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm --dir mail-worker install --frozen-lockfile
      - run: pnpm --dir mail-vue install --frozen-lockfile
      - run: echo "RELEASE_DIR=$RUNNER_TEMP/ai-agent-cloud-mail" >> "$GITHUB_ENV"
      - name: Generate temporary deployment configuration
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path

          output = Path(os.environ["RELEASE_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          source = tomllib.loads(Path("mail-worker/wrangler-action.toml").read_text())
          allowed_source = {"name", "main", "compatibility_date", "compatibility_flags",
                            "observability", "routes", "d1_databases", "kv_namespaces",
                            "r2_buckets", "ai", "assets", "triggers", "vars", "build"}
          unexpected = sorted(set(source) - allowed_source)
          if unexpected:
              raise SystemExit(f"Unsupported upstream Wrangler fields: {unexpected}")

          databases = source.get("d1_databases")
          namespaces = source.get("kv_namespaces")
          assets = source.get("assets")
          triggers = source.get("triggers", {})
          if not (isinstance(databases, list) and len(databases) == 1 and
                  databases[0].get("binding") == "db" and databases[0].get("database_name")):
              raise SystemExit("Expected exactly one db D1 binding")
          if not (isinstance(namespaces, list) and len(namespaces) == 1 and
                  namespaces[0].get("binding") == "kv"):
              raise SystemExit("Expected exactly one kv namespace binding")
          safe_asset_keys = ("binding", "not_found_handling", "run_worker_first", "html_handling")
          if not (isinstance(assets, dict) and assets.get("binding") == "assets"):
              raise SystemExit("Expected the assets binding")
          unexpected_assets = sorted(set(assets) - set(safe_asset_keys) - {"directory"})
          if unexpected_assets:
              raise SystemExit(f"Unsupported upstream asset fields: {unexpected_assets}")
          if not isinstance(triggers, dict) or set(triggers) - {"crons"}:
              raise SystemExit("Only cron triggers are supported")

          config = {key: source[key] for key in
                    ("compatibility_date", "compatibility_flags", "observability", "triggers")
                    if key in source}
          config.update(name="cloud-mail-prepare",
                        main=str(Path("mail-worker/src/index.js").resolve()),
                        workers_dev=False, preview_urls=False, keep_vars=True)
          config["d1_databases"] = [{"binding": "db",
                                      "database_name": databases[0]["database_name"],
                                      "database_id": "00000000-0000-0000-0000-000000000000"}]
          config["kv_namespaces"] = [{"binding": "kv", "id": "00000000000000000000000000000000"}]
          config["assets"] = {key: assets[key] for key in safe_asset_keys if key in assets}
          config["assets"]["directory"] = str(output / "assets")
          config["vars"] = {"domain": ["example.invalid"], "admin": "owner@example.invalid",
                            "analysis_cache": False, "project_link": True}
          # Prepare contains placeholders only. Deployment values and credentials stay out of artifacts.
          payload = json.dumps(config, ensure_ascii=False, indent=2)
          if "${" in payload or "jwt_secret" in config["vars"]:
              raise SystemExit("Unresolved or secret configuration")
          (output / "wrangler.json").write_text(payload + "\n")
          PY
      - name: Build upstream frontend
        working-directory: mail-vue
        env:
          VITE_BASE_URL: /api
          VITE_OUT_DIR: ${{ runner.temp }}/ai-agent-cloud-mail/assets
        run: pnpm run build
      - name: Bundle upstream Worker without publishing
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --dry-run --strict --config "$RELEASE_DIR/wrangler.json" --outdir "$RELEASE_DIR/worker"
      - name: Make the prepared artifact portable
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RELEASE_DIR"])
          if not (output / "worker/index.js").is_file():
              raise SystemExit("Worker bundle missing")
          if not (output / "assets/index.html").is_file():
              raise SystemExit("Frontend build missing")
          path = output / "wrangler.json"
          config = json.loads(path.read_text())
          config["main"] = "worker/index.js"
          config["assets"]["directory"] = "assets"
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-mail-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-agent-cloud-mail/
          retention-days: 35
          if-no-files-found: error
          overwrite: true
